services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./projet:/var/www/html
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # <- Ajouté pour Xdebug sur Windows/WSL2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet

  selenium:
    image: selenium/standalone-chrome:157.0-20261101
    shm_size: 2gb
    ports:
      - "4444:4444"
    depends_on:
      - web
    networks:
      - webnet

  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - fil_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - webnet
 
volumes:
  fil_db_data:
 
networks:
  webnet:
