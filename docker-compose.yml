services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./projet:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet

  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: e_commerce
      MYSQL_USER: web_user
      MYSQL_PASSWORD: masterApp2809
      MYSQL_ROOT_PASSWORD: rootMasApp2026?
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webnet

volumes:
  db_data:

networks:
  webnet: