services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./projet:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webnet


  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - fil_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - webnet
 
volumes:
  fil_db_data:
 
networks:
  webnet:
